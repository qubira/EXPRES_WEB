<div class="container mt-24" style="max-width:640px;">
  <h1 class="section-title" style="margin-bottom:4px;">Mis pedidos</h1>
  <p class="text-muted" id="saludo-cliente"></p>

  <div class="filtros mt-16" id="filtro-fecha-pedidos">
    <button class="chip activo" data-rango="hoy">Hoy</button>
    <button class="chip" data-rango="ayer">Ayer</button>
    <button class="chip" data-rango="todos">Todos</button>
  </div>

  <div id="contenido" class="mt-16"></div>
</div>

<div style="height:20px;"></div>

<nav class="tabbar">
  <a href="index.html" class="tabbar-item"><span class="tabbar-icon">🏠</span>Inicio</a>
  <a href="catalogo.html" class="tabbar-item"><span class="tabbar-icon">🔍</span>Catálogo</a>
  <a href="mis-pedidos.html" class="tabbar-item activo"><span class="tabbar-icon">📦</span>Pedidos</a>
  <a href="carrito.html" class="tabbar-item">
    <span class="tabbar-icon">🛒</span>Carrito
    <span class="tabbar-badge hidden" data-cart-count>0</span>
  </a>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth-cliente.js"></script>
<script>
if (!clienteEstaLogueado()) {
  location.href = 'login.html?next=mis-pedidos.html';
}
document.getElementById('saludo-cliente').textContent = `Hola, ${getClienteNombre()} 👋`;

function tarjetaPedido(p) {
  return `
    <div class="card card-pad mt-16">
      <div class="flex justify-between items-center">
        <div>
          <div class="text-sm text-muted">Pedido #${p.id.slice(0,8).toUpperCase()}</div>
          <strong>${formatoSoles(p.monto_total)}</strong>
        </div>
        <span class="badge badge-${p.estado}">${labelEstado(p.estado)}</span>
      </div>
      <div class="text-sm text-muted mt-8">📍 ${p.zona_entrega}</div>
      <div class="text-sm text-muted">${new Date(p.created_at).toLocaleString('es-PE')}</div>
      ${p.pin_entrega ? `<div class="mt-8"><span class="tag" style="background:#fff3d6;color:#b7690a;">🔑 PIN: ${p.pin_entrega}</span></div>` : ''}
      <a href="pedido.html?id=${p.id}" class="btn btn-secondary btn-sm btn-block mt-8">Ver detalle del pedido →</a>
    </div>
  `;
}

function esMismoDia(fechaA, fechaB) {
  return fechaA.getFullYear() === fechaB.getFullYear()
    && fechaA.getMonth() === fechaB.getMonth()
    && fechaA.getDate() === fechaB.getDate();
}

let rangoFechaActivo = 'hoy';
let todosPedidosCache = null;

async function cargarPedidos() {
  const cont = document.getElementById('contenido');
  cont.innerHTML = '<p class="text-center text-muted">Cargando...</p>';
  try {
    todosPedidosCache = await Api.clientePedidos();
    renderPedidosFiltrados();
  } catch (err) {
    if (err.status === 401) {
      cerrarSesionCliente();
      location.href = 'login.html?next=mis-pedidos.html';
      return;
    }
    cont.innerHTML = `<p class="text-center form-error">${err.message}</p>`;
  }
}

function renderPedidosFiltrados() {
  const cont = document.getElementById('contenido');
  const ahora = new Date();
  const ayer = new Date(ahora);
  ayer.setDate(ayer.getDate() - 1);

  const filtrados = todosPedidosCache.filter((p) => {
    if (rangoFechaActivo === 'todos') return true;
    const fecha = new Date(p.created_at);
    if (rangoFechaActivo === 'hoy') return esMismoDia(fecha, ahora);
    if (rangoFechaActivo === 'ayer') return esMismoDia(fecha, ayer);
    return true;
  });

  if (todosPedidosCache.length === 0) {
    cont.innerHTML = `
      <div class="empty-state">
        <div class="icon">🛍️</div>
        <p>Aún no tienes pedidos.</p>
        <a href="catalogo.html" class="btn btn-primary">Ver catálogo</a>
      </div>
    `;
    return;
  }

  if (filtrados.length === 0) {
    cont.innerHTML = `
      <div class="empty-state">
        <div class="icon">📦</div>
        <p>No tienes pedidos en ese rango.</p>
        <button type="button" class="btn btn-outline btn-sm mt-8" data-ver-todos>Ver todos mis pedidos</button>
      </div>
    `;
    document.getElementById('contenido').querySelector('[data-ver-todos]').addEventListener('click', () => {
      rangoFechaActivo = 'todos';
      document.querySelectorAll('#filtro-fecha-pedidos .chip').forEach((c) => c.classList.toggle('activo', c.dataset.rango === 'todos'));
      renderPedidosFiltrados();
    });
    return;
  }

  cont.innerHTML = filtrados.map(tarjetaPedido).join('');
}

document.querySelectorAll('#filtro-fecha-pedidos .chip').forEach((chip) => {
  chip.addEventListener('click', () => {
    rangoFechaActivo = chip.dataset.rango;
    document.querySelectorAll('#filtro-fecha-pedidos .chip').forEach((c) => c.classList.remove('activo'));
    chip.classList.add('activo');
    renderPedidosFiltrados();
  });
});

cargarPedidos();
</script>
</body>
</html>
