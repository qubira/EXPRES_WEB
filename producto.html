<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto | Express Ancon</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="con-tabbar">

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><img src="assets/logo-navbar.png" alt="Express" class="brand-logo"></a>
    <div class="nav-cta-group">
      <div class="account-menu">
        <button class="account-trigger" type="button">
          <span class="icon-btn account-btn">👤</span>
          <span class="account-name hidden"></span>
        </button>
        <div class="account-dropdown hidden">
          <div class="account-dropdown-header">Mi cuenta</div>
          <a href="mis-pedidos.html">📦 Mis pedidos</a>
          <a href="mi-cuenta.html">✏️ Editar datos</a>
          <button type="button" class="btn-logout-cuenta salir">🚪 Cerrar sesión</button>
        </div>
      </div>
      <div class="cart-menu">
        <button class="cart-trigger icon-btn" type="button">
          🛒 <span class="badge-count hidden" data-cart-count>0</span>
        </button>
        <div class="cart-dropdown hidden">
          <div class="cart-dropdown-header">Tu carrito</div>
          <div class="cart-dropdown-items"></div>
          <div class="cart-dropdown-footer">
            <div class="flex justify-between items-center mb-0"><span class="text-sm">Total</span><strong data-cart-total>S/ 0.00</strong></div>
            <a href="carrito.html" class="btn btn-primary btn-block mt-8">Ir a pagar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div id="estado-carga" class="container mt-24 text-center text-muted">Cargando producto...</div>

<div id="contenido" class="hidden">
  <div class="container mt-16">
    <a href="javascript:history.back()" class="text-sm" style="color:var(--mar-700);font-weight:700;">← Volver</a>

    <div class="card mt-16 producto-layout">
      <div id="producto-media" class="producto-media"></div>
      <div class="card-pad producto-info">
        <div class="flex gap-8 mt-0" id="producto-tags"></div>
        <h1 style="font-size:22px;margin:10px 0 2px;" id="producto-nombre"></h1>
        <div class="text-sm text-muted" id="producto-marca"></div>
        <div class="flex justify-between items-center mt-16">
          <div>
            <div class="precio" id="producto-precio" style="font-size:26px;"></div>
            <div class="text-sm text-muted" id="producto-unidad"></div>
          </div>
          <div id="detalle-control"></div>
        </div>

        <hr class="divider">
        <div id="producto-detalle-wrap" class="hidden">
          <h3 style="font-size:15px;">Detalle</h3>
          <p class="text-sm text-muted" id="producto-descripcion"></p>
        </div>

        <div class="flex items-center gap-12 mt-16" style="background:var(--arena-100);border-radius:var(--radio-m);padding:14px;">
          <div style="font-size:28px;">🏪</div>
          <div>
            <strong id="producto-tienda-nombre"></strong>
            <div class="text-sm text-muted" id="producto-tienda-zona"></div>
            <div class="text-sm" id="producto-tienda-direccion" style="color:var(--mar-700);font-weight:600;display:none;"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <section class="mt-24" id="similares-wrap">
    <div class="container">
      <h2 style="font-size:19px;">También te puede interesar</h2>
    </div>
    <div class="product-grid container" id="grid-similares"></div>
  </section>
</div>

<div style="height:20px;"></div>

<div class="cart-bar hidden" id="cart-bar">
  <div>
    <div class="cart-bar-info">Tu carrito</div>
    <div class="cart-bar-total" data-cart-total>S/ 0.00</div>
  </div>
  <a href="carrito.html" class="btn btn-primary">Ver carrito (<span data-cart-count>0</span>)</a>
</div>

<nav class="tabbar">
  <a href="index.html" class="tabbar-item"><span class="tabbar-icon">🏠</span>Inicio</a>
  <a href="catalogo.html" class="tabbar-item activo"><span class="tabbar-icon">🔍</span>Catálogo</a>
  <a href="pedido.html" class="tabbar-item"><span class="tabbar-icon">📦</span>Pedidos</a>
  <a href="carrito.html" class="tabbar-item">
    <span class="tabbar-icon">🛒</span>Carrito
    <span class="tabbar-badge hidden" data-cart-count>0</span>
  </a>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth-cliente.js"></script>
<script src="js/ubicacion.js"></script>
<script src="js/producto.js"></script>
</body>
</html>
