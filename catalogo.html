<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catálogo | Express Ancon</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="con-tabbar">

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><img src="assets/logo-navbar.png" alt="Express" class="brand-logo"></a>
    <div class="nav-links">
      <a href="catalogo.html"><strong>Catálogo</strong></a>
      <a href="index.html#como-funciona">Cómo funciona</a>
      <a href="pedido.html">Rastrear pedido</a>
    </div>
    <a href="carrito.html" class="icon-btn">
      🛒 <span class="badge-count hidden" data-cart-count>0</span>
    </a>
  </div>
  <div class="location-bar">📍 <span class="zona-texto">Entregando en Playa Ancón</span> <span class="chevron">▾</span></div>
  <div class="search-bar-wrap">
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="search" id="buscador" placeholder="Buscar producto (ej. anticucho, sombrero...)">
    </div>
  </div>
</nav>

<div class="container mt-16">
  <div class="filtros" id="filtros"></div>

  <div id="estado-carga" class="text-center text-muted" style="padding:40px 0;">Cargando productos...</div>
  <div class="product-grid" id="grid-productos"></div>
  <div id="vacio" class="empty-state hidden">
    <div class="icon">🐚</div>
    <p>No encontramos productos con ese filtro.</p>
  </div>
</div>

<div style="height:20px;"></div>

<div class="cart-bar hidden" id="cart-bar">
  <div>
    <div class="cart-bar-info">Tu carrito</div>
    <div class="cart-bar-total" data-cart-total>S/ 0.00</div>
  </div>
  <a href="carrito.html" class="btn btn-primary">Ver carrito (<span data-cart-count>0</span>)</a>
</div>

<nav class="tabbar">
  <a href="index.html" class="tabbar-item"><span class="tabbar-icon">🏠</span>Inicio</a>
  <a href="catalogo.html" class="tabbar-item activo"><span class="tabbar-icon">🔍</span>Catálogo</a>
  <a href="pedido.html" class="tabbar-item"><span class="tabbar-icon">📦</span>Pedidos</a>
  <a href="carrito.html" class="tabbar-item">
    <span class="tabbar-icon">🛒</span>Carrito
    <span class="tabbar-badge hidden" data-cart-count>0</span>
  </a>
</nav>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/ubicacion.js"></script>
<script src="js/catalogo.js"></script>
</body>
</html>
