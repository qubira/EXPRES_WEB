<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/png" href="assets/favicon.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi pedido | Express Ancon</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/styles.css">
</head>
<body class="con-tabbar">

<nav class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="brand"><img src="assets/logo-navbar.png" alt="Express" class="brand-logo"></a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="catalogo.html">Catálogo</a>
      <a href="index.html#como-funciona">Cómo funciona</a>
      <a href="pedido.html"><strong>Rastrear pedido</strong></a>
    </div>
    <div class="nav-cta-group">
      <div class="account-menu">
        <button class="account-trigger" type="button">
          <span class="icon-btn account-btn">👤</span>
          <span class="account-name hidden"></span>
        </button>
        <div class="account-dropdown hidden">
          <div class="account-dropdown-header">Mi cuenta</div>
          <a href="mis-pedidos.html">📦 Mis pedidos</a>
          <a href="mi-cuenta.html">✏️ Editar datos</a>
          <button type="button" class="btn-logout-cuenta salir">🚪 Cerrar sesión</button>
        </div>
      </div>
      <div class="cart-menu">
        <button class="cart-trigger icon-btn" type="button">
          🛒 <span class="badge-count hidden" data-cart-count>0</span>
        </button>
        <div class="cart-dropdown hidden">
          <div class="cart-dropdown-header">Tu carrito</div>
          <div class="cart-dropdown-items"></div>
          <div class="cart-dropdown-footer">
            <div class="flex justify-between items-center mb-0"><span class="text-sm">Total</span><strong data-cart-total>S/ 0.00</strong></div>
            <a href="carrito.html" class="btn btn-primary btn-block mt-8">Ir a pagar</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container mt-24" style="max-width:560px;">
  <h1 class="section-title">Rastrear pedido</h1>

  <a href="pedido.html" id="volver-mis-pedidos" class="hidden text-sm" style="display:inline-block;">← Volver a mis pedidos</a>

  <div id="bloque-mis-pedidos" class="hidden">
    <div class="filtros" id="filtro-fecha-pedidos">
      <button class="chip activo" data-rango="hoy">Hoy</button>
      <button class="chip" data-rango="ayer">Ayer</button>
      <button class="chip" data-rango="todos">Todos</button>
    </div>
    <div id="lista-mis-pedidos" class="mt-16"></div>
  </div>

  <details class="mt-16" id="detalle-buscar-codigo">
    <summary class="text-sm text-muted" style="cursor:pointer;">¿Tienes el código de otro pedido?</summary>
    <div id="slot-form-buscar" class="mt-8"></div>
  </details>

  <form id="form-buscar" class="card card-pad flex gap-8" style="align-items:flex-end;">
    <div class="form-grupo mb-0" style="flex:1;">
      <label>ID de tu pedido</label>
      <input type="text" id="input-id" placeholder="Pega aquí el ID de tu pedido">
    </div>
    <button class="btn btn-secondary" type="submit">Buscar</button>
  </form>

  <div id="contenido" class="mt-16"></div>
</div>

<div style="height:20px;"></div>

<nav class="tabbar">
  <a href="index.html" class="tabbar-item"><span class="tabbar-icon">🏠</span>Inicio</a>
  <a href="catalogo.html" class="tabbar-item"><span class="tabbar-icon">🔍</span>Catálogo</a>
  <a href="pedido.html" class="tabbar-item activo"><span class="tabbar-icon">📦</span>Pedidos</a>
  <a href="carrito.html" class="tabbar-item">
    <span class="tabbar-icon">🛒</span>Carrito
    <span class="tabbar-badge hidden" data-cart-count>0</span>
  </a>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/cart.js"></script>
<script src="js/auth-cliente.js"></script>
<script src="js/pedido.js"></script>
</body>
</html>
